<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── PALETTE ─────────────────────────────────────────────────────────────────
const C = {
  bg:"#ede0c4",bg2:"#e2d4b0",bg3:"#d4c49a",card:"#f5edd8",
  border:"#8b7355",border2:"#6b5535",
  text:"#3d2b1f",textMid:"#6b5535",textFade:"#a0886a",
  green:"#4a7c3f",greenBg:"#d4e8c8",
  gold:"#8b6914",goldBg:"#f0e0a0",
  orange:"#c47a1e",orangeBg:"#f5ddb0",
  brown:"#7a4a2a",red:"#8b2a1a",redBg:"#f0d0c8",
};
const JB = "'JetBrains Mono', monospace";

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
function createSB(url, key) {
  const h = {"Content-Type":"application/json", apikey:key, Authorization:`Bearer ${key}`};
  const base = url.replace(/\/rest\/v1\/?$/,"").replace(/\/$/,"");
  const rest = `${base}/rest/v1`;
  return {
    from: (table) => ({
      select: (cols="*") => ({
        _f:[], _o:null,
        eq(c,v){this._f.push(`${c}=eq.${encodeURIComponent(v)}`);return this;},
        order(c,{ascending:a=true}={}){this._o=`${c}.${a?"asc":"desc"}`;return this;},
        async then(resolve){
          try{
            let u=`${rest}/${table}?select=${cols}`;
            this._f.forEach(f=>u+=`&${f}`);
            if(this._o) u+=`&order=${this._o}`;
            const r=await fetch(u,{headers:h});
            const d=await r.json();
            if(!r.ok) throw new Error(d.message||JSON.stringify(d));
            resolve({data:d,error:null});
          }catch(e){resolve({data:null,error:e});}
        }
      }),
      insert: (rows) => ({
        select:(cols="*")=>({
          async then(resolve){
            try{
              const r=await fetch(`${rest}/${table}?select=${cols}`,{method:"POST",headers:{...h,Prefer:"return=representation"},body:JSON.stringify(Array.isArray(rows)?rows:[rows])});
              const d=await r.json();if(!r.ok)throw new Error(d.message||JSON.stringify(d));
              resolve({data:d,error:null});
            }catch(e){resolve({data:null,error:e});}
          }
        }),
        async then(resolve){
          try{
            const r=await fetch(`${rest}/${table}`,{method:"POST",headers:{...h,Prefer:"return=minimal"},body:JSON.stringify(Array.isArray(rows)?rows:[rows])});
            if(!r.ok){const d=await r.json();throw new Error(d.message||JSON.stringify(d));}
            resolve({data:null,error:null});
          }catch(e){resolve({data:null,error:e});}
        }
      }),
      update:(vals)=>({
        eq(col,val){return{async then(resolve){
          try{
            const r=await fetch(`${rest}/${table}?${col}=eq.${encodeURIComponent(val)}`,{method:"PATCH",headers:{...h,Prefer:"return=minimal"},body:JSON.stringify(vals)});
            if(!r.ok){const d=await r.json();throw new Error(d.message||JSON.stringify(d));}
            resolve({data:null,error:null});
          }catch(e){resolve({data:null,error:e});}
        }};}
      }),
      delete:()=>({
        eq(col,val){return{async then(resolve){
          try{
            const r=await fetch(`${rest}/${table}?${col}=eq.${encodeURIComponent(val)}`,{method:"DELETE",headers:h});
            if(!r.ok){const d=await r.json();throw new Error(d.message||JSON.stringify(d));}
            resolve({data:null,error:null});
          }catch(e){resolve({data:null,error:e});}
        }};}
      }),
    }),
  };
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function getBrowserGPS(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){reject(new Error("Not supported"));return;}
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,display:`GPS (±${Math.round(p.coords.accuracy)}m)`}),
      e=>reject(new Error(e.message)),
      {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
    );
  });
}

async function geocodeAddress(address){
  try{
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(address)}&limit=5&lang=en`);
    const d=await r.json();
    return (d.features||[]).map(f=>{
      const p=f.properties;
      return{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],
        display:[p.name,p.city||p.town||p.village,p.country].filter(Boolean).join(", ")};
    });
  }catch{return[];}
}

async function fetchProductImage(name,key){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      system:`Find a product image URL. Return ONLY JSON: {"imageUrl":"https://...","description":"short"}. Direct URL (.jpg .png .webp). If not found: {"imageUrl":"","description":""}`,
      messages:[{role:"user",content:`Find product image: ${name}`}]})
  });
  const d=await res.json();
  const t=d.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"{}";
  try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch{return{imageUrl:"",description:""};}
}

async function searchChainStores(query,lat,lng,key){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      system:`Find products in physical walk-in shops in Slovakia near Michalovce. Search tesco.sk, lidl.sk, kaufland.sk, dm.sk, action.com, intersport.sk, bardiauto.sk. Return ONLY JSON array: [{"shopName":"Tesco","address":"Nábrežná 1, Michalovce","productName":"name","price":9.99,"status":"in_stock","mapsUrl":"https://maps.google.com/?q=Tesco+Michalovce"}]. status: in_stock|check_in_store. Physical only. Max 5. Empty [] if nothing.`,
      messages:[{role:"user",content:`Search for "${query}" near Michalovce Slovakia. Lat:${lat} Lng:${lng}`}]})
  });
  const d=await res.json();
  const t=d.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"[]";
  try{const c=t.replace(/```json|```/g,"").trim();const s=c.indexOf("["),e=c.lastIndexOf("]");if(s===-1)return[];return JSON.parse(c.slice(s,e+1));}catch{return[];}
}

// ─── UI COMPONENTS ────────────────────────────────────────────────────────────
const PxBtn=({children,onClick,disabled,variant="default",style={}})=>{
  const V={
    default:{bg:C.bg2,b:C.border,c:C.text,sh:C.border2},
    primary:{bg:C.green,b:"#2d5a1e",c:"#fff",sh:"#1a3a0e"},
    gold:{bg:C.gold,b:"#5a4000",c:"#fff",sh:"#3a2800"},
    active:{bg:C.brown,b:C.border2,c:C.card,sh:"#3a2010"},
  }[variant]||{};
  return(
    <button onClick={onClick} disabled={disabled}
      style={{fontFamily:JB,fontSize:10,fontWeight:700,letterSpacing:1,padding:"8px 14px",
        background:disabled?C.bg3:V.bg,border:`3px solid ${disabled?C.textFade:V.b}`,
        boxShadow:disabled?"none":`3px 3px 0 ${V.sh}`,color:disabled?C.textFade:V.c,
        cursor:disabled?"not-allowed":"pointer",...style}}>
      {children}
    </button>
  );
};

const PxBox=({children,style={}})=>(
  <div style={{background:C.card,border:`3px solid ${C.border}`,boxShadow:`4px 4px 0 ${C.border2}`,padding:16,...style}}>
    {children}
  </div>
);

const Lbl=({children})=>(
  <div style={{fontFamily:JB,fontSize:10,fontWeight:700,color:C.textMid,letterSpacing:2,marginBottom:10}}>
    {children}
  </div>
);

const Msg=({type,children})=>{
  const s={success:{bg:C.greenBg,b:C.green,c:C.green},error:{bg:C.redBg,b:C.red,c:C.red},info:{bg:C.goldBg,b:C.gold,c:C.gold}}[type]||{};
  return <div style={{padding:"9px 12px",background:s.bg,border:`2px solid ${s.b}`,fontFamily:JB,fontSize:11,color:s.c,lineHeight:1.6,marginTop:10}}>{children}</div>;
};

const SC={available:C.green,in_stock:C.green,on_request:C.orange,check_in_store:C.gold};
const SBG={available:C.greenBg,in_stock:C.greenBg,on_request:C.orangeBg,check_in_store:C.goldBg};
const SL=(t,s)=>({available:t.inStock,in_stock:t.inStock,on_request:t.onRequest,check_in_store:t.checkStore}[s]||(s||"").toUpperCase());

const T={
  en:{title:"ITEM FINDER",sub:"// LOCAL SHOP SEARCH",gpsBtn:"USE GPS",manualBtn:"ENTER ADDRESS",
    addrPh:"Type address or city...",locating:"LOCATING...",pickResult:"SELECT YOUR LOCATION:",
    noGeoResults:"No address found. Try adding city or country.",
    searchPh:"Search item... e.g. blue leather dye",searchBtn:"SEARCH",searching:"SEARCHING...",
    found:"FOUND",resultsFor:"RESULTS FOR",inStock:"IN STOCK",onRequest:"ON REQUEST",
    checkStore:"CHECK IN STORE",mapsLink:"OPEN MAP",km:"km",
    noResults:"NO ITEMS FOUND NEARBY",tryDiff:"Try different terms or expand radius.",
    local:"LOCAL",chain:"CHAIN",radius:"RADIUS",lang:"SK"},
  sk:{title:"HĽADAČ TOVARU",sub:"// VYHĽADÁVANIE OBCHODOV",gpsBtn:"GPS POLOHA",manualBtn:"ZADAŤ ADRESU",
    addrPh:"Zadajte adresu alebo mesto...",locating:"URČUJEM...",pickResult:"VYBERTE POLOHU:",
    noGeoResults:"Adresa nenájdená. Skúste pridať mesto.",
    searchPh:"Hľadať tovar... napr. modrá kožená farba",searchBtn:"HĽADAŤ",searching:"HĽADÁM...",
    found:"NÁJDENÝCH",resultsFor:"VÝSLEDKOV PRE",inStock:"SKLADOM",onRequest:"NA OBJEDNÁVKU",
    checkStore:"OVERIŤ V OBCHODE",mapsLink:"OTVORIŤ MAPU",km:"km",
    noResults:"ŽIADNY TOVAR V OKOLÍ",tryDiff:"Skúste iný výraz alebo väčší polomer.",
    local:"MIESTNY",chain:"REŤAZEC",radius:"POLOMER",lang:"EN"},
};

// ════════════════════════════════════════════════════════════════════════════
// CUSTOMER SEARCH
// ════════════════════════════════════════════════════════════════════════════
function CustomerSearch({config,sb,lang,setLang}){
  const t=T[lang];
  const [locMode,setLocMode]=useState("gps");
  const [manAddr,setManAddr]=useState("");
  const [geoResults,setGeoResults]=useState([]);
  const [lat,setLat]=useState(null);const [lng,setLng]=useState(null);
  const [locLabel,setLocLabel]=useState("");const [locating,setLocating]=useState(false);const [locErr,setLocErr]=useState("");
  const [radius,setRadius]=useState(5);
  const [query,setQuery]=useState("");
  const [searching,setSearching]=useState(false);const [results,setResults]=useState(null);
  const [searched,setSearched]=useState("");const [phase,setPhase]=useState("");

  async function handleGPS(){
    setLocating(true);setLocErr("");setLocLabel("");setGeoResults([]);
    try{const geo=await getBrowserGPS();setLat(geo.lat);setLng(geo.lng);setLocLabel(geo.display);}
    catch(e){setLocErr(`GPS failed: ${e.message}. Try entering address manually.`);}
    setLocating(false);
  }

  async function handleGeocode(){
    if(!manAddr.trim())return;
    setLocating(true);setLocErr("");setGeoResults([]);setLocLabel("");
    const res=await geocodeAddress(manAddr);
    if(res.length===0)setLocErr(t.noGeoResults);
    else if(res.length===1){setLat(res[0].lat);setLng(res[0].lng);setLocLabel(res[0].display);}
    else setGeoResults(res);
    setLocating(false);
  }

  function pickGeo(r){setLat(r.lat);setLng(r.lng);setLocLabel(r.display);setGeoResults([]);}

  async function doSearch(){
    if(!query.trim()||!lat||!lng||searching)return;
    setSearching(true);setSearched(query.trim());setResults(null);
    const local=[],chains=[];
    setPhase("Checking registered shops...");
    try{
      const {data:shops}=await sb.from("shops").select("*");
      const {data:prods}=await sb.from("products").select("*");
      if(shops&&prods){
        const q=query.toLowerCase();
        prods.forEach(p=>{
          if((p.name||"").toLowerCase().includes(q)||(p.category||"").toLowerCase().includes(q)||(p.description||"").toLowerCase().includes(q)){
            if(p.quantity>0||p.status==="on_request"){
              const shop=shops.find(s=>s.id===p.shop_id);
              if(shop){
                let sLat=48.7547,sLng=21.9201;
                if(shop.location){const m=shop.location.match(/POINT\(([0-9.\-]+)\s+([0-9.\-]+)\)/);if(m){sLng=parseFloat(m[1]);sLat=parseFloat(m[2]);}}
                const dist=haversineKm(lat,lng,sLat,sLng);
                if(dist<=radius)local.push({type:"local",shopName:shop.name,address:shop.address,city:shop.city,phone:shop.phone,
                  mapsUrl:shop.google_maps_link||`https://maps.google.com/?q=${encodeURIComponent(shop.name+" "+shop.address+" "+shop.city)}`,
                  productName:p.name,price:p.price,status:p.status,imageUrl:p.image_url,dist});
              }
            }
          }
        });
      }
    }catch{}
    setPhase("Scanning chain stores...");
    try{
      const ch=await searchChainStores(query,lat,lng,config.anthropicKey);
      ch.forEach(c=>{if(c.status!=="out_of_stock")chains.push({type:"chain",shopName:c.shopName,address:c.address,city:"",
        mapsUrl:c.mapsUrl||`https://maps.google.com/?q=${encodeURIComponent(c.shopName+" Michalovce")}`,
        productName:c.productName,price:c.price,status:c.status,dist:null});});
    }catch{}
    local.sort((a,b)=>a.dist-b.dist);
    setResults([...local,...chains]);setPhase("");setSearching(false);
  }

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:JB}}>
      <div style={{background:C.bg2,borderBottom:`4px solid ${C.border}`,boxShadow:`0 4px 0 ${C.border2}`,padding:"18px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:JB,fontWeight:800,fontSize:20,color:C.brown,letterSpacing:2}}>{t.title}</div>
          <div style={{fontFamily:JB,fontSize:11,color:C.textFade,marginTop:3,letterSpacing:2}}>{t.sub}</div>
        </div>
        <PxBtn onClick={()=>setLang(lang==="en"?"sk":"en")} style={{fontSize:9}}>{t.lang}</PxBtn>
      </div>

      <div style={{maxWidth:780,margin:"0 auto",padding:"28px 20px"}}>

        <PxBox style={{marginBottom:14}}>
          <Lbl>▸ LOCATION</Lbl>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            <PxBtn onClick={()=>{setLocMode("gps");setGeoResults([]);}} variant={locMode==="gps"?"active":"default"}>◎ {t.gpsBtn}</PxBtn>
            <PxBtn onClick={()=>{setLocMode("manual");setGeoResults([]);}} variant={locMode==="manual"?"active":"default"}>✎ {t.manualBtn}</PxBtn>
          </div>
          {locMode==="gps"&&(
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <PxBtn onClick={handleGPS} disabled={locating} variant="primary">► {locating?t.locating:t.gpsBtn}</PxBtn>
              <span style={{fontFamily:JB,fontSize:10,color:C.textFade}}>// Uses device GPS</span>
            </div>
          )}
          {locMode==="manual"&&(
            <div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <input value={manAddr} onChange={e=>setManAddr(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleGeocode()}
                  placeholder={t.addrPh}
                  style={{flex:1,minWidth:220,padding:"9px 12px",background:C.bg,border:`3px solid ${C.border}`,fontFamily:JB,fontSize:12,color:C.text,boxShadow:`2px 2px 0 ${C.border2}`,outline:"none"}}/>
                <PxBtn onClick={handleGeocode} disabled={locating||!manAddr.trim()} variant="primary">► {locating?"...":"GO"}</PxBtn>
              </div>
              {geoResults.length>0&&(
                <div style={{marginTop:10}}>
                  <div style={{fontFamily:JB,fontSize:9,color:C.textMid,letterSpacing:2,marginBottom:6}}>{t.pickResult}</div>
                  {geoResults.map((r,i)=>(
                    <div key={i} onClick={()=>pickGeo(r)}
                      style={{padding:"8px 12px",background:C.bg,border:`2px solid ${C.border}`,fontFamily:JB,fontSize:11,color:C.text,cursor:"pointer",marginBottom:4}}
                      onMouseEnter={e=>e.currentTarget.style.background=C.bg2}
                      onMouseLeave={e=>e.currentTarget.style.background=C.bg}>
                      📍 {r.display}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {locLabel&&!locating&&<Msg type="success">✓ Location: {locLabel}</Msg>}
          {locErr&&<Msg type="error">✗ {locErr}</Msg>}
        </PxBox>

        <PxBox style={{marginBottom:14}}>
          <Lbl>▸ {t.radius}</Lbl>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {[2,5,10,20,50].map(r=>(
              <PxBtn key={r} onClick={()=>setRadius(r)} variant={radius===r?"gold":"default"}>{r} {t.km}</PxBtn>
            ))}
          </div>
        </PxBox>

        <PxBox style={{marginBottom:24}}>
          <Lbl>▸ SEARCH ITEM</Lbl>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <div style={{flex:1,display:"flex",minWidth:220,border:`3px solid ${C.border}`,background:C.bg,boxShadow:`3px 3px 0 ${C.border2}`}}>
              <span style={{padding:"9px 12px",fontFamily:JB,fontWeight:800,fontSize:14,color:C.gold,animation:"blink 1s step-end infinite",borderRight:`2px solid ${C.border}`}}>█</span>
              <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}
                placeholder={t.searchPh}
                style={{flex:1,padding:"9px 12px",background:"transparent",border:"none",fontFamily:JB,fontSize:13,color:C.text,outline:"none"}}/>
            </div>
            <PxBtn onClick={doSearch} disabled={searching||!lat} variant="primary" style={{whiteSpace:"nowrap"}}>► {searching?"...":t.searchBtn}</PxBtn>
          </div>
          {!lat&&<div style={{marginTop:8,fontFamily:JB,fontSize:10,color:C.textFade}}>⚠ Set your location first</div>}
        </PxBox>

        {searching&&(
          <PxBox style={{textAlign:"center",padding:"32px 16px"}}>
            <div style={{fontFamily:JB,fontWeight:700,fontSize:11,color:C.brown,marginBottom:16,letterSpacing:2}}>{phase||"SEARCHING..."}</div>
            <div style={{display:"flex",gap:6,justifyContent:"center"}}>
              {["▪","▫","▪","▫","▪","▫","▪"].map((ch,i)=>(
                <span key={i} style={{fontFamily:JB,fontSize:16,color:C.gold,animation:`blink 0.8s ${i*0.1}s step-end infinite`}}>{ch}</span>
              ))}
            </div>
          </PxBox>
        )}

        {results!==null&&!searching&&(
          <div>
            <div style={{marginBottom:14,padding:"10px 14px",background:C.bg2,border:`3px solid ${C.border}`,boxShadow:`3px 3px 0 ${C.border2}`,fontFamily:JB,fontSize:11,fontWeight:600,letterSpacing:1,lineHeight:2}}>
              <span style={{color:C.green}}>{t.found} </span>
              <span style={{color:C.orange}}>{results.length} </span>
              <span style={{color:C.textMid}}>{t.resultsFor} </span>
              <span style={{color:C.brown,fontWeight:800}}>"{searched}"</span>
            </div>
            {results.length===0&&(
              <PxBox style={{textAlign:"center",padding:32}}>
                <div style={{fontFamily:JB,fontWeight:700,fontSize:11,color:C.textFade,lineHeight:2}}>
                  {t.noResults}<br/><span style={{fontSize:10,fontWeight:400}}>{t.tryDiff}</span>
                </div>
              </PxBox>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {results.map((r,i)=>(
                <div key={i} className="rrow" style={{animationDelay:`${i*0.06}s`,background:C.card,border:`3px solid ${r.type==="local"?C.green:C.brown}`,boxShadow:`4px 4px 0 ${r.type==="local"?"#2d5a1e":C.border2}`,padding:"14px 16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",gap:10,alignItems:"baseline",flexWrap:"wrap",marginBottom:7}}>
                        <span style={{fontFamily:JB,fontWeight:400,fontSize:11,color:C.textFade}}>{String(i+1).padStart(2,"0")}.</span>
                        <span style={{fontFamily:JB,fontWeight:800,fontSize:13,color:r.type==="local"?C.green:C.brown}}>{r.shopName}</span>
                        {r.dist!==null&&<span style={{fontFamily:JB,fontSize:11,fontWeight:600,color:C.orange}}>— {r.dist.toFixed(1)}{t.km}</span>}
                        <span style={{fontFamily:JB,fontSize:9,fontWeight:700,padding:"2px 7px",background:r.type==="local"?C.greenBg:C.bg3,border:`2px solid ${r.type==="local"?C.green:C.border}`,color:r.type==="local"?C.green:C.textMid,letterSpacing:2}}>
                          {r.type==="local"?t.local:t.chain}
                        </span>
                      </div>
                      <div style={{fontFamily:JB,fontSize:12,color:C.text,marginBottom:5,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                        <span style={{fontWeight:700,color:C.brown}}>{r.productName}</span>
                        {r.price>0&&<><span style={{color:C.textFade}}>—</span><span style={{fontWeight:800,color:C.gold}}>€{parseFloat(r.price).toFixed(2)}</span></>}
                        <span style={{color:C.textFade}}>—</span>
                        <span style={{fontFamily:JB,fontSize:9,fontWeight:700,padding:"2px 7px",background:SBG[r.status]||C.bg2,border:`2px solid ${SC[r.status]||C.border}`,color:SC[r.status]||C.textMid,letterSpacing:1}}>{SL(t,r.status)}</span>
                      </div>
                      <div style={{fontFamily:JB,fontSize:11,color:C.textFade}}>
                        📍 {r.address}{r.city?`, ${r.city}`:""}
                        {r.phone&&<span style={{marginLeft:12}}>☎ {r.phone}</span>}
                      </div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
                      {r.imageUrl&&(
                        <div style={{width:52,height:52,border:`3px solid ${C.border}`,background:C.bg2,overflow:"hidden"}}>
                          <img src={r.imageUrl} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>
                        </div>
                      )}
                      <a href={r.mapsUrl} target="_blank" rel="noreferrer" style={{textDecoration:"none"}}>
                        <div style={{fontFamily:JB,fontWeight:700,fontSize:9,padding:"6px 10px",background:C.bg2,border:`3px solid ${C.border}`,color:C.brown,boxShadow:`2px 2px 0 ${C.border2}`,letterSpacing:1,cursor:"pointer"}}>
                          {t.mapsLink} →
                        </div>
                      </a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// SUPPLIER DASHBOARD
// ════════════════════════════════════════════════════════════════════════════
const TABS=["Setup","Upload","Products","Images"];
const SS_C={available:"#4ade80",on_request:"#fb923c"};
const SS_L={available:"Available",on_request:"On Request"};

function SupplierDashboard({config,sb}){
  const [tab,setTab]=useState("Setup");
  const [shop,setShop]=useState(()=>{try{return JSON.parse(localStorage.getItem("ppi_shop")||"null");}catch{return null;}});
  const [shopForm,setShopForm]=useState({name:"",address:"",city:"Michalovce",phone:"",google_maps_link:"",...(shop||{})});
  const [shopSaving,setShopSaving]=useState(false);const [shopMsg,setShopMsg]=useState("");
  const [products,setProducts]=useState([]);const [prodLoading,setProdLoading]=useState(false);
  const [editingProd,setEditingProd]=useState(null);
  const [prodForm,setProdForm]=useState({name:"",price:"",category:"",quantity:"",status:"available",description:""});
  const [prodMsg,setProdMsg]=useState("");const [lowStock,setLowStock]=useState(5);
  const [uploadRows,setUploadRows]=useState([]);const [uploading,setUploading]=useState(false);const [uploadMsg,setUploadMsg]=useState("");
  const [imageMode,setImageMode]=useState("review");const [imageQueue,setImageQueue]=useState([]);
  const [fetchingImages,setFetchingImages]=useState(false);const [imageMsg,setImageMsg]=useState("");
  const fileRef=useRef();

  useEffect(()=>{if(sb&&shop?.id)loadProducts();},[sb,shop]);

  async function saveShop(){
    setShopSaving(true);setShopMsg("");
    const geoRes=await geocodeAddress(shopForm.address+", "+shopForm.city);
    const slat=geoRes[0]?.lat||48.7547,slng=geoRes[0]?.lng||21.9201;
    const payload={name:shopForm.name,address:shopForm.address,city:shopForm.city,phone:shopForm.phone,google_maps_link:shopForm.google_maps_link,location:`POINT(${slng} ${slat})`};
    let result;
    if(shop?.id){
      result=await sb.from("shops").update(payload).eq("id",shop.id);
      if(!result.error){const u={...shop,...shopForm};setShop(u);localStorage.setItem("ppi_shop",JSON.stringify(u));setShopMsg("✓ Updated");}
    }else{
      result=await sb.from("shops").insert(payload).select("*");
      if(!result.error&&result.data?.[0]){const s={...result.data[0],...shopForm};setShop(s);localStorage.setItem("ppi_shop",JSON.stringify(s));setShopMsg("✓ Shop created");}
    }
    if(result.error)setShopMsg("✗ "+result.error.message);
    setShopSaving(false);
  }

  async function loadProducts(){
    setProdLoading(true);
    const{data,error}=await sb.from("products").select("*").eq("shop_id",shop.id).order("name",{ascending:true});
    if(!error&&data)setProducts(data);
    setProdLoading(false);
  }

  async function saveProduct(){
    setProdMsg("");
    const payload={shop_id:shop.id,name:prodForm.name,description:prodForm.description,price:parseFloat(prodForm.price)||0,category:prodForm.category,quantity:parseInt(prodForm.quantity)||0,status:prodForm.status,updated_at:new Date().toISOString()};
    const result=editingProd?await sb.from("products").update(payload).eq("id",editingProd.id):await sb.from("products").insert({...payload,image_approved:false});
    if(result.error){setProdMsg("✗ "+result.error.message);return;}
    setProdMsg(editingProd?"✓ Updated":"✓ Added");
    setEditingProd(null);setProdForm({name:"",price:"",category:"",quantity:"",status:"available",description:""});loadProducts();
  }

  async function deleteProduct(id){
    if(!window.confirm("Delete this product?"))return;
    await sb.from("products").delete().eq("id",id);loadProducts();
  }

  async function toggleStatus(p){
    await sb.from("products").update({status:p.status==="available"?"on_request":"available",updated_at:new Date().toISOString()}).eq("id",p.id);loadProducts();
  }

  function parseFile(file){
    const ext=file.name.split(".").pop().toLowerCase();
    const process=(raw)=>{
      const rows=raw.map(row=>{
        const n={};Object.keys(row).forEach(k=>{n[k.toLowerCase().replace(/\s+/g,"")]=row[k];});
        return{name:n.name||n.product||n.productname||n.item||"",price:parseFloat(n.price||0)||0,category:n.category||n.type||"",quantity:parseInt(n.quantity||n.stock||n.qty||0)||0,status:String(n.status||"").toLowerCase().includes("request")?"on_request":"available",description:n.description||n.desc||""};
      }).filter(r=>r.name);
      setUploadRows(rows);setUploadMsg(`Found ${rows.length} products`);
    };
    if(ext==="csv"){Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>process(r.data)});}
    else{const reader=new FileReader();reader.onload=e=>{const wb=XLSX.read(e.target.result,{type:"array"});process(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));};reader.readAsArrayBuffer(file);}
  }

  async function importProducts(){
    setUploading(true);setUploadMsg("Importing...");
    let imported=0;
    const payload=uploadRows.map(r=>({...r,shop_id:shop.id,image_approved:false,updated_at:new Date().toISOString()}));
    for(let i=0;i<payload.length;i+=50){const{error}=await sb.from("products").insert(payload.slice(i,i+50));if(!error)imported+=Math.min(50,payload.length-i);}
    setUploadMsg(`✓ Imported ${imported} products`);setUploading(false);setUploadRows([]);loadProducts();
  }

  async function runImageFetch(){
    const toFetch=products.filter(p=>!p.image_url);
    if(!toFetch.length){setImageMsg("All products have images.");return;}
    setFetchingImages(true);setImageMsg(`Fetching ${toFetch.length} images...`);
    if(imageMode==="auto"){
      let done=0;
      for(const p of toFetch){const r=await fetchProductImage(p.name,config.anthropicKey);if(r.imageUrl)await sb.from("products").update({image_url:r.imageUrl,description:r.description||p.description,image_approved:true,updated_at:new Date().toISOString()}).eq("id",p.id);done++;setImageMsg(`${done}/${toFetch.length} done...`);}
      setImageMsg(`✓ Done. ${done} processed.`);loadProducts();
    }else{setImageQueue(toFetch.map(p=>({...p,_fetching:false,_result:null})));setImageMsg("Click FETCH on each product.");}
    setFetchingImages(false);
  }

  async function fetchQueueItem(idx){
    setImageQueue(q=>q.map((x,i)=>i===idx?{...x,_fetching:true}:x));
    const r=await fetchProductImage(imageQueue[idx].name,config.anthropicKey);
    setImageQueue(q=>q.map((x,i)=>i===idx?{...x,_fetching:false,_result:r}:x));
  }

  async function approveImage(idx){
    const item=imageQueue[idx];
    await sb.from("products").update({image_url:item._result.imageUrl,description:item._result.description||item.description,image_approved:true,updated_at:new Date().toISOString()}).eq("id",item.id);
    setImageQueue(q=>q.filter((_,i)=>i!==idx));loadProducts();
  }

  const fi=(val,key,ph,type="text")=>(
    <input type={type} value={val} onChange={e=>setProdForm(x=>({...x,[key]:e.target.value}))} placeholder={ph}
      style={{padding:"9px 11px",border:"1px solid #e0d8cc",borderRadius:2,fontSize:12,background:"#faf8f5",outline:"none",width:"100%",fontFamily:JB,color:"#1a1208"}}/>
  );

  const sBtn=(label,onClick,disabled)=>(
    <button onClick={onClick} disabled={disabled}
      style={{padding:"8px 18px",background:"#1a1208",color:"#c8a96e",border:"none",borderRadius:2,fontSize:10,letterSpacing:2,cursor:disabled?"not-allowed":"pointer",fontFamily:JB,opacity:disabled?0.5:1}}>
      {label}
    </button>
  );

  return(
    <div style={{minHeight:"100vh",background:"#f5f2ee",fontFamily:JB,color:"#1a1208"}}>
      <div style={{background:"#1a1208",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"3px solid #c8a96e"}}>
        <div style={{padding:"15px 0"}}>
          <div style={{fontFamily:JB,fontWeight:800,fontSize:17,color:"#c8a96e",letterSpacing:2}}>PUBLIC PRODUCT INVENTORY</div>
          <div style={{fontFamily:JB,fontWeight:400,fontSize:9,color:"#7a6a4a",letterSpacing:3,marginTop:2}}>SUPPLIER DASHBOARD</div>
        </div>
        {shop&&<div style={{textAlign:"right"}}><div style={{fontFamily:JB,fontWeight:700,fontSize:12,color:"#c8a96e"}}>{shop.name}</div><div style={{fontFamily:JB,fontSize:10,color:"#7a6a4a"}}>{shop.city}</div></div>}
      </div>

      <div style={{maxWidth:1080,margin:"0 auto",padding:"22px 18px"}}>
        <div style={{display:"flex",gap:2,marginBottom:22,borderBottom:"2px solid #e0d8cc"}}>
          {TABS.map(t=>(
            <button key={t} className="tbtn" onClick={()=>setTab(t)}
              style={{padding:"8px 20px",fontSize:10,letterSpacing:2,background:tab===t?"#1a1208":"transparent",color:tab===t?"#c8a96e":"#7a6a4a",border:"none",borderRadius:"2px 2px 0 0",cursor:"pointer",fontFamily:JB,fontWeight:tab===t?700:400}}>
              {t.toUpperCase()}
            </button>
          ))}
          <div style={{flex:1}}/>
          <button onClick={()=>{localStorage.clear();window.location.reload();}}
            style={{padding:"6px 12px",fontSize:9,background:"transparent",border:"1px solid #e0d8cc",borderRadius:2,color:"#aaa",cursor:"pointer",marginBottom:2,letterSpacing:1,fontFamily:JB}}>
            RESET KEYS
          </button>
        </div>

        {tab==="Setup"&&(
          <div className="fade" style={{maxWidth:540}}>
            <div style={{fontFamily:JB,fontWeight:800,fontSize:20,marginBottom:20}}>Shop Profile</div>
            {[{k:"name",l:"SHOP NAME",p:"e.g. Novák Hardware"},{k:"address",l:"STREET ADDRESS",p:"e.g. Hlavná 12"},{k:"city",l:"CITY",p:"Michalovce"},{k:"phone",l:"PHONE",p:"+421 ..."},{k:"google_maps_link",l:"GOOGLE MAPS LINK (optional)",p:"https://maps.google.com/..."}].map(f=>(
              <div key={f.k} style={{marginBottom:14}}>
                <label style={{display:"block",fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a",marginBottom:4}}>{f.l}</label>
                <input value={shopForm[f.k]||""} onChange={e=>setShopForm(x=>({...x,[f.k]:e.target.value}))} placeholder={f.p}
                  style={{width:"100%",padding:"9px 12px",border:"1px solid #e0d8cc",borderRadius:2,fontSize:13,background:"#faf8f5",outline:"none",fontFamily:JB,color:"#1a1208"}}/>
              </div>
            ))}
            {sBtn(shopSaving?"SAVING...":shop?.id?"UPDATE SHOP":"CREATE SHOP",saveShop,shopSaving||!shopForm.name||!shopForm.address)}
            {shopMsg&&<div style={{marginTop:10,fontSize:12,color:shopMsg.startsWith("✓")?"#27ae60":"#c0392b",fontFamily:JB}}>{shopMsg}</div>}
            {shop&&(
              <div style={{marginTop:24,padding:16,background:"#fff",border:"1px solid #e0d8cc",borderRadius:2}}>
                <div style={{fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a",marginBottom:8}}>CURRENT SHOP</div>
                <div style={{fontFamily:JB,fontWeight:800,fontSize:16}}>{shop.name}</div>
                <div style={{fontFamily:JB,fontSize:11,color:"#7a6a4a",marginTop:3}}>{shop.address}, {shop.city}</div>
                <div style={{marginTop:10,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {[{l:`${products.length} products`,c:"#7a6a4a"},{l:`${products.filter(p=>p.status==="available").length} available`,c:"#27ae60"},{l:`${products.filter(p=>p.status==="on_request").length} on request`,c:"#fb923c"}].map((b,i)=>(
                    <span key={i} style={{padding:"3px 9px",background:"#f0ebe3",borderRadius:20,fontFamily:JB,fontSize:9,color:b.c}}>{b.l}</span>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="Upload"&&(
          <div className="fade">
            <div style={{fontFamily:JB,fontWeight:800,fontSize:20,marginBottom:6}}>Upload Inventory</div>
            <div style={{fontFamily:JB,fontSize:11,color:"#7a6a4a",marginBottom:22}}>Columns: name · price · category · quantity · status · description</div>
            {!shop?.id&&<div style={{padding:12,background:"#fff8e1",border:"1px solid #f0d060",borderRadius:2,fontFamily:JB,fontSize:11,color:"#7a6a4a",marginBottom:18}}>⚠ Complete Shop Profile first.</div>}
            <div onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();parseFile(e.dataTransfer.files[0]);}}
              style={{border:"2px dashed #c4b9aa",borderRadius:3,padding:40,textAlign:"center",cursor:"pointer",background:"#faf8f5",marginBottom:18}}>
              <div style={{fontSize:26,marginBottom:8}}>📂</div>
              <div style={{fontFamily:JB,fontSize:12,color:"#7a6a4a"}}>Drop file here or click to browse</div>
              <div style={{fontFamily:JB,fontSize:9,color:"#c4b9aa",marginTop:4,letterSpacing:2}}>CSV · XLSX · XLS</div>
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>parseFile(e.target.files[0])}/>
            </div>
            {uploadMsg&&<div style={{marginBottom:12,fontFamily:JB,fontSize:12,color:uploadMsg.startsWith("✓")?"#27ae60":"#7a6a4a",padding:"9px 13px",background:"#fff",border:"1px solid #e0d8cc",borderRadius:2}}>{uploadMsg}</div>}
            {uploadRows.length>0&&(
              <>
                <div style={{background:"#fff",border:"1px solid #e0d8cc",borderRadius:2,overflow:"hidden",marginBottom:14}}>
                  <div style={{padding:"8px 13px",background:"#f5f2ee",borderBottom:"1px solid #e0d8cc",fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a",display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr"}}>
                    <span>NAME</span><span>PRICE</span><span>CATEGORY</span><span>QTY</span><span>STATUS</span>
                  </div>
                  <div style={{maxHeight:240,overflowY:"auto"}}>
                    {uploadRows.slice(0,50).map((r,i)=>(
                      <div key={i} style={{padding:"8px 13px",borderBottom:"1px solid #f0ebe3",display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",fontFamily:JB,fontSize:11}}>
                        <span>{r.name}</span><span>€{r.price.toFixed(2)}</span><span style={{color:"#7a6a4a"}}>{r.category||"—"}</span><span>{r.quantity}</span>
                        <span style={{color:SS_C[r.status],fontSize:9}}>{SS_L[r.status]}</span>
                      </div>
                    ))}
                  </div>
                </div>
                {sBtn(uploading?"IMPORTING...":`IMPORT ${uploadRows.length} PRODUCTS`,importProducts,uploading||!shop?.id)}
              </>
            )}
            <div style={{marginTop:24,padding:16,background:"#fff",border:"1px solid #e0d8cc",borderRadius:2}}>
              <div style={{fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a",marginBottom:8}}>EXAMPLE CSV</div>
              <pre style={{fontFamily:JB,fontSize:10,color:"#7a6a4a",margin:0,lineHeight:1.8,background:"#f5f2ee",padding:10,borderRadius:2,overflow:"auto"}}>{`name,price,category,quantity,status\nBlue Leather Dye 100ml,8.99,Craft Supplies,15,available\nMilk 1L,0.99,Dairy,50,available`}</pre>
            </div>
          </div>
        )}

        {tab==="Products"&&(
          <div className="fade">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontFamily:JB,fontWeight:800,fontSize:20}}>Products</div>
                <div style={{fontFamily:JB,fontSize:10,color:"#7a6a4a",marginTop:2}}>{products.length} total · {products.filter(p=>p.quantity<=lowStock&&p.quantity>0).length} low · {products.filter(p=>p.quantity===0).length} out of stock</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontFamily:JB,fontSize:10,color:"#7a6a4a"}}>Low stock at:</span>
                <input type="number" value={lowStock} onChange={e=>setLowStock(parseInt(e.target.value)||5)} style={{width:52,padding:"5px 7px",border:"1px solid #e0d8cc",borderRadius:2,fontFamily:JB,fontSize:12,textAlign:"center"}}/>
                <button onClick={loadProducts} style={{padding:"6px 11px",background:"#f5f2ee",border:"1px solid #e0d8cc",borderRadius:2,fontFamily:JB,fontSize:9,cursor:"pointer",color:"#7a6a4a"}}>↺</button>
              </div>
            </div>
            <div style={{background:"#fff",border:"1px solid #e0d8cc",borderRadius:2,padding:16,marginBottom:18}}>
              <div style={{fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a",marginBottom:12}}>{editingProd?"EDITING PRODUCT":"ADD PRODUCT"}</div>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:9,marginBottom:9}}>{fi(prodForm.name,"name","Product name")}{fi(prodForm.price,"price","Price (€)","number")}{fi(prodForm.category,"category","Category")}{fi(prodForm.quantity,"quantity","Quantity","number")}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 3fr",gap:9,marginBottom:11}}>
                <select value={prodForm.status} onChange={e=>setProdForm(x=>({...x,status:e.target.value}))} style={{padding:"9px 11px",border:"1px solid #e0d8cc",borderRadius:2,fontFamily:JB,fontSize:12,background:"#faf8f5",outline:"none"}}>
                  <option value="available">Available</option><option value="on_request">On Request</option>
                </select>
                {fi(prodForm.description,"description","Short description (optional)")}
              </div>
              <div style={{display:"flex",gap:8}}>
                {sBtn(editingProd?"UPDATE":"ADD",saveProduct,!prodForm.name)}
                {editingProd&&<button onClick={()=>{setEditingProd(null);setProdForm({name:"",price:"",category:"",quantity:"",status:"available",description:""}); }} style={{padding:"8px 16px",background:"transparent",color:"#7a6a4a",border:"1px solid #e0d8cc",borderRadius:2,fontFamily:JB,fontSize:10,letterSpacing:2,cursor:"pointer"}}>CANCEL</button>}
              </div>
              {prodMsg&&<div style={{marginTop:8,fontFamily:JB,fontSize:11,color:prodMsg.startsWith("✓")?"#27ae60":"#c0392b"}}>{prodMsg}</div>}
            </div>
            <div style={{background:"#fff",border:"1px solid #e0d8cc",borderRadius:2,overflow:"hidden"}}>
              <div style={{padding:"8px 13px",background:"#f5f2ee",borderBottom:"1px solid #e0d8cc",display:"grid",gridTemplateColumns:"32px 2.5fr 1fr 1fr 1fr 1fr 100px",gap:8,fontFamily:JB,fontSize:9,letterSpacing:2,color:"#7a6a4a"}}>
                <span/><span>PRODUCT</span><span>PRICE</span><span>CAT</span><span>QTY</span><span>STATUS</span><span>ACTIONS</span>
              </div>
              {prodLoading?<div style={{padding:28,textAlign:"center",fontFamily:JB,color:"#c4b9aa",fontSize:11}}>Loading...</div>:
              products.length===0?<div style={{padding:28,textAlign:"center",fontFamily:JB,color:"#c4b9aa",fontSize:11}}>No products yet.</div>:
              products.map(p=>(
                <div key={p.id} className="prow" style={{padding:"10px 13px",borderBottom:"1px solid #f0ebe3",display:"grid",gridTemplateColumns:"32px 2.5fr 1fr 1fr 1fr 1fr 100px",gap:8,alignItems:"center",transition:"background 0.15s"}}>
                  <div style={{width:28,height:28,borderRadius:2,background:"#f0ebe3",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {p.image_url?<img src={p.image_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:11}}>📦</span>}
                  </div>
                  <div><div style={{fontFamily:JB,fontSize:11,fontWeight:700}}>{p.name}</div>{!p.image_approved&&<span style={{fontFamily:JB,fontSize:9,color:"#fb923c"}}>no image</span>}</div>
                  <div style={{fontFamily:JB,fontSize:11}}>€{parseFloat(p.price||0).toFixed(2)}</div>
                  <div style={{fontFamily:JB,fontSize:10,color:"#7a6a4a"}}>{p.category||"—"}</div>
                  <div style={{fontFamily:JB,fontSize:11,color:p.quantity===0?"#c0392b":p.quantity<=lowStock?"#e67e22":"#1a1208",fontWeight:p.quantity<=lowStock?700:400}}>
                    {p.quantity}
                    {p.quantity===0&&<span style={{fontSize:9,display:"block",color:"#c0392b"}}>OUT</span>}
                    {p.quantity>0&&p.quantity<=lowStock&&<span style={{fontSize:9,display:"block",color:"#e67e22"}}>LOW</span>}
                  </div>
                  <button onClick={()=>toggleStatus(p)} className="act" style={{padding:"3px 8px",fontFamily:JB,fontSize:9,letterSpacing:1,border:"none",borderRadius:20,cursor:"pointer",background:SS_C[p.status]+"22",color:SS_C[p.status]}}>{SS_L[p.status]}</button>
                  <div style={{display:"flex",gap:4}}>
                    <button className="act" onClick={()=>{setEditingProd(p);setProdForm({name:p.name,price:p.price,category:p.category||"",quantity:p.quantity,status:p.status,description:p.description||""});window.scrollTo(0,0);}} style={{padding:"4px 8px",fontFamily:JB,fontSize:9,background:"#f0ebe3",border:"none",borderRadius:2,cursor:"pointer",color:"#7a6a4a"}}>Edit</button>
                    <button className="act" onClick={()=>deleteProduct(p.id)} style={{padding:"4px 8px",fontFamily:JB,fontSize:9,background:"#fdf0f0",border:"none",borderRadius:2,cursor:"pointer",color:"#c0392b"}}>Del</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="Images"&&(
          <div className="fade">
            <div style={{fontFamily:JB,fontWeight:800,fontSize:20,marginBottom:6}}>Image Management</div>
            <div style={{fontFamily:JB,fontSize:11,color:"#7a6a4a",marginBottom:22}}>AI searches the web for product images automatically.</div>
            <div style={{display:"flex",gap:0,marginBottom:18,border:"1px solid #e0d8cc",borderRadius:2,overflow:"hidden",width:"fit-content"}}>
              {["auto","review"].map(m=><button key={m} onClick={()=>setImageMode(m)} style={{padding:"8px 22px",fontFamily:JB,fontSize:9,letterSpacing:2,border:"none",cursor:"pointer",background:imageMode===m?"#1a1208":"#faf8f5",color:imageMode===m?"#c8a96e":"#7a6a4a"}}>{m==="auto"?"AUTO APPLY":"REVIEW EACH"}</button>)}
            </div>
            <div style={{fontFamily:JB,fontSize:11,color:"#7a6a4a",marginBottom:14}}>{products.filter(p=>!p.image_url).length} without images · {products.filter(p=>p.image_approved).length} approved</div>
            {sBtn(fetchingImages?"FETCHING...":"FETCH MISSING IMAGES",runImageFetch,fetchingImages||!products.filter(p=>!p.image_url).length)}
            {imageMsg&&<div style={{margin:"14px 0",padding:"9px 13px",background:"#fff",border:"1px solid #e0d8cc",borderRadius:2,fontFamily:JB,fontSize:11,color:"#7a6a4a"}}>{imageMsg}</div>}
            {imageMode==="review"&&imageQueue.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:12,marginTop:14}}>
                {imageQueue.map((item,idx)=>(
                  <div key={item.id} style={{background:"#fff",border:"1px solid #e0d8cc",borderRadius:2,overflow:"hidden"}}>
                    <div style={{height:130,background:"#f0ebe3",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {item._fetching&&<div style={{fontFamily:JB,fontSize:10,color:"#7a6a4a"}}>Searching...</div>}
                      {item._result?.imageUrl&&!item._fetching&&<img src={item._result.imageUrl} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>}
                      {!item._result&&!item._fetching&&<span style={{fontSize:22}}>📦</span>}
                    </div>
                    <div style={{padding:9}}>
                      <div style={{fontFamily:JB,fontSize:10,fontWeight:700,marginBottom:6,lineHeight:1.4}}>{item.name.slice(0,28)}</div>
                      <div style={{display:"flex",gap:5}}>
                        {!item._result&&!item._fetching&&<button onClick={()=>fetchQueueItem(idx)} style={{flex:1,padding:"5px",fontFamily:JB,fontSize:9,letterSpacing:1,background:"#1a1208",color:"#c8a96e",border:"none",borderRadius:2,cursor:"pointer"}}>FETCH</button>}
                        {item._result&&(<>
                          <button onClick={()=>approveImage(idx)} style={{flex:1,padding:"5px",fontFamily:JB,fontSize:9,background:"#27ae60",color:"#fff",border:"none",borderRadius:2,cursor:"pointer"}}>✓ USE</button>
                          <button onClick={()=>fetchQueueItem(idx)} style={{padding:"5px 7px",fontFamily:JB,fontSize:9,background:"#f0ebe3",color:"#7a6a4a",border:"none",borderRadius:2,cursor:"pointer"}}>↺</button>
                          <button onClick={()=>setImageQueue(q=>q.filter((_,i)=>i!==idx))} style={{padding:"5px 7px",fontFamily:JB,fontSize:9,background:"#fdf0f0",color:"#c0392b",border:"none",borderRadius:2,cursor:"pointer"}}>✕</button>
                        </>)}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// ROOT
// ════════════════════════════════════════════════════════════════════════════
function App(){
  const [config,setConfig]=useState(()=>{try{return JSON.parse(localStorage.getItem("ppi_config")||"{}");}catch{return{};}});
  const [setupDone,setSetupDone]=useState(()=>!!localStorage.getItem("ppi_config_done"));
  const [mode,setMode]=useState("customer");const [lang,setLang]=useState("en");
  const [cfgForm,setCfgForm]=useState({supabaseUrl:"",supabaseKey:"",anthropicKey:"",...config});
  const [cfgSaving,setCfgSaving]=useState(false);const [cfgError,setCfgError]=useState("");
  const [sb,setSb]=useState(()=>{try{const c=JSON.parse(localStorage.getItem("ppi_config")||"{}");if(c.supabaseUrl&&c.supabaseKey)return createSB(c.supabaseUrl,c.supabaseKey);}catch{}return null;});

  async function saveConfig(){
    setCfgSaving(true);setCfgError("");
    if(!cfgForm.supabaseUrl||!cfgForm.supabaseKey||!cfgForm.anthropicKey){setCfgError("All three keys are required.");setCfgSaving(false);return;}
    // Test Supabase
    try{
      const base=cfgForm.supabaseUrl.trim().replace(/\/rest\/v1\/?$/,"").replace(/\/$/,"");
      const r=await fetch(`${base}/rest/v1/shops?select=id&limit=1`,{headers:{apikey:cfgForm.supabaseKey.trim(),Authorization:`Bearer ${cfgForm.supabaseKey.trim()}`}});
      if(!r.ok){const d=await r.json();setCfgError(`Supabase: ${d.message||r.status} — check URL and anon key`);setCfgSaving(false);return;}
    }catch(e){setCfgError(`Supabase unreachable: ${e.message} — URL must be https://xxxx.supabase.co`);setCfgSaving(false);return;}
    // Test Anthropic
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":cfgForm.anthropicKey.trim(),"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:10,messages:[{role:"user",content:"hi"}]})});
      if(!r.ok){const d=await r.json();setCfgError(`Anthropic: ${d.error?.message||r.status} — check API key`);setCfgSaving(false);return;}
    }catch(e){setCfgError(`Anthropic: ${e.message}`);setCfgSaving(false);return;}

    const c={supabaseUrl:cfgForm.supabaseUrl.trim(),supabaseKey:cfgForm.supabaseKey.trim(),anthropicKey:cfgForm.anthropicKey.trim()};
    localStorage.setItem("ppi_config",JSON.stringify(c));localStorage.setItem("ppi_config_done","1");
    setConfig(c);setSetupDone(true);setSb(createSB(c.supabaseUrl,c.supabaseKey));setCfgSaving(false);
  }

  if(!setupDone) return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:JB,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{maxWidth:480,width:"100%",padding:"0 22px"}}>
        <PxBox style={{padding:32}}>
          <div style={{fontFamily:JB,fontWeight:800,fontSize:18,color:C.brown,marginBottom:4,letterSpacing:2}}>PUBLIC PRODUCT</div>
          <div style={{fontFamily:JB,fontWeight:800,fontSize:18,color:C.brown,marginBottom:20,letterSpacing:2}}>INVENTORY</div>
          <div style={{fontFamily:JB,fontSize:10,color:C.textFade,marginBottom:24,lineHeight:1.9}}>
            Enter your API keys to begin.<br/>
            Keys are tested before saving.<br/>
            Stored in your browser only.
          </div>
          {[{k:"supabaseUrl",l:"SUPABASE PROJECT URL",p:"https://xxxx.supabase.co"},{k:"supabaseKey",l:"SUPABASE ANON KEY",p:"sb_publishable_..."},{k:"anthropicKey",l:"ANTHROPIC API KEY",p:"sk-ant-..."}].map(f=>(
            <div key={f.k} style={{marginBottom:16}}>
              <label style={{display:"block",fontFamily:JB,fontWeight:700,fontSize:9,color:C.textMid,marginBottom:6,letterSpacing:2}}>{f.l}</label>
              <input type="password" value={cfgForm[f.k]} onChange={e=>setCfgForm(x=>({...x,[f.k]:e.target.value}))} placeholder={f.p}
                style={{width:"100%",padding:"10px 13px",background:C.bg,border:`3px solid ${C.border}`,fontFamily:JB,fontSize:12,color:C.text,boxShadow:`3px 3px 0 ${C.border2}`,outline:"none"}}/>
            </div>
          ))}
          {cfgError&&<div style={{fontFamily:JB,color:C.red,fontSize:11,marginBottom:14,padding:"10px 12px",background:C.redBg,border:`2px solid ${C.red}`,lineHeight:1.7}}>✗ {cfgError}</div>}
          <PxBtn onClick={saveConfig} disabled={cfgSaving} variant="primary" style={{width:"100%",fontSize:10,padding:"12px"}}>
            ► {cfgSaving?"TESTING KEYS...":"TEST & CONNECT"}
          </PxBtn>
          <div style={{marginTop:12,fontFamily:JB,fontSize:9,color:C.textFade,lineHeight:2}}>
            // URL format: https://xxxx.supabase.co<br/>
            // No /rest/v1 at the end
          </div>
        </PxBox>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{position:"fixed",bottom:16,right:16,zIndex:999,display:"flex",gap:6,background:C.bg2,padding:8,border:`3px solid ${C.border}`,boxShadow:`4px 4px 0 ${C.border2}`}}>
        <PxBtn onClick={()=>setMode("customer")} variant={mode==="customer"?"primary":"default"} style={{fontSize:8}}>▸ CUSTOMER</PxBtn>
        <PxBtn onClick={()=>setMode("supplier")} variant={mode==="supplier"?"gold":"default"} style={{fontSize:8}}>▸ SUPPLIER</PxBtn>
      </div>
      {mode==="customer"?<CustomerSearch config={config} sb={sb} lang={lang} setLang={setLang}/>:<SupplierDashboard config={config} sb={sb}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
